<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Vegas 2077 - Rocket Crash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #06070d;
      --bg-card: rgba(14, 16, 28, 0.94);
      --neon-yellow: #fcee0a;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff003c;
      --neon-green: #05ffa1;
      --neon-purple: #9d00ff;
      --text-muted: #737994;
      --text-main: #e6ebf5;
      --border-cyber: rgba(0, 240, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.16) 0%, transparent 55%),
        linear-gradient(rgba(6, 7, 13, 0.94), rgba(6, 7, 13, 0.94));
    }

    #app {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-cyber);
      padding: 10px 12px;
      border-radius: 6px;
      position: relative;
    }

    .header-panel::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: var(--neon-cyan);
    }

    .logo-box {
      display: flex;
      flex-direction: column;
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: var(--neon-yellow);
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(252, 238, 10, 0.5);
    }

    .sub-title {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
    }

    .balance-box {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--neon-cyan);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-cyber);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .round-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .history-tape {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }
    .history-tape::-webkit-scrollbar { display: none; }

    .history-item {
      padding: 2px 6px;
      font-size: 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #23273a;
      border-radius: 3px;
      white-space: nowrap;
    }
    .history-item.low { border-color: var(--neon-pink); color: var(--neon-pink); }
    .history-item.mid { border-color: var(--neon-cyan); color: var(--neon-cyan); }
    .history-item.high { border-color: var(--neon-green); color: var(--neon-green); }

    .canvas-viewport {
      width: 100%;
      height: 230px;
      background: radial-gradient(circle at 10% 90%, #15162a 0%, #080913 75%);
      border: 1px solid rgba(0, 240, 255, 0.14);
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .center-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-multiplier {
      font-family: 'Orbitron', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.45);
      line-height: 1;
    }
    .hud-multiplier.crashed {
      color: var(--neon-pink) !important;
      text-shadow: 0 0 20px rgba(255, 0, 60, 0.8) !important;
    }

    .hud-status {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-grid {
      display: flex;
      gap: 8px;
    }

    .cyber-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }

    .cyber-input {
      background: #090a12;
      border: 1px solid #23273a;
      padding: 7px 9px;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .cyber-input:focus {
      border-color: var(--neon-cyan);
    }
    .cyber-input:disabled {
      opacity: 0.45;
      border-color: #1a1c27;
      background: #05060a;
    }

    .quick-chips {
      display: flex;
      gap: 6px;
    }

    .chip-btn {
      flex: 1;
      padding: 5px 0;
      background: #111320;
      border: 1px solid #23273a;
      border-radius: 3px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: #9aa1ba;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip-btn:active:not(:disabled) {
      border-color: var(--neon-cyan);
      color: #ffffff;
    }
    .chip-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .action-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .action-button:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn-state-bet {
      background: var(--neon-yellow);
      color: #050608;
      box-shadow: 0 0 16px rgba(252, 238, 10, 0.4);
    }
    .btn-state-cashout {
      background: var(--neon-green);
      color: #040806;
      box-shadow: 0 0 16px rgba(5, 255, 161, 0.5);
    }
    .btn-state-disabled {
      background: #1a1c29;
      color: #555c73;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-state-crashed {
      background: var(--neon-pink);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 0, 60, 0.45);
      cursor: not-allowed;
    }
    .btn-state-taken {
      background: rgba(5, 255, 161, 0.14);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header-panel">
      <div class="logo-box">
        <span class="logo-text">CYBER VEGAS 2077</span>
        <span class="sub-title">CRASH ROCKET ENGINE</span>
      </div>
      <div class="balance-box" id="hudBalance">10,000 ED</div>
    </header>

    <section class="game-card">
      <div class="round-meta-bar">
        <span id="hudRoundId">ROUND: #---</span>
        <span id="hudStatePill">STATUS: BETTING</span>
      </div>

      <div class="history-tape" id="hudHistoryTape">
        <span class="history-item high">4.22x</span>
        <span class="history-item mid">1.84x</span>
        <span class="history-item low">1.10x</span>
        <span class="history-item high">2.75x</span>
        <span class="history-item mid">1.54x</span>
      </div>

      <div class="canvas-viewport">
        <canvas id="stageCanvas" width="414" height="230"></canvas>
        <div class="center-overlay">
          <div class="hud-multiplier" id="hudMultiplier">1.00x</div>
          <div class="hud-status" id="hudStatus">ОКНО СТАВОК (5с)</div>
        </div>
      </div>

      <div class="controls-wrapper">
        <div class="bet-grid">
          <div class="cyber-field">
            <span class="field-label">СТАВКА (ED)</span>
            <input type="number" id="inputBet" class="cyber-input" value="500" min="10" step="10" />
          </div>
          <div class="cyber-field">
            <span class="field-label">АВТО-ВЫВОД</span>
            <input type="number" id="inputAutoCash" class="cyber-input" value="2.00" min="1.01" step="0.1" />
          </div>
        </div>

        <div class="quick-chips">
          <button class="chip-btn" data-val="100">100</button>
          <button class="chip-btn" data-val="500">500</button>
          <button class="chip-btn" data-val="1000">1K</button>
          <button class="chip-btn" data-val="5000">5K</button>
        </div>

        <button id="btnAction" class="action-button btn-state-bet">СТАВКА</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      function haptic(type) {
        try {
          if (!tg?.HapticFeedback) return;
          if (type === 'cashout') tg.HapticFeedback.notificationOccurred('success');
          else if (type === 'crash') tg.HapticFeedback.notificationOccurred('error');
          else tg.HapticFeedback.impactOccurred('medium');
        } catch (_) {}
      }

      let userBalance = 10000;

      const dom = {
        balance: document.getElementById('hudBalance'),
        roundId: document.getElementById('hudRoundId'),
        statePill: document.getElementById('hudStatePill'),
        history: document.getElementById('hudHistoryTape'),
        canvas: document.getElementById('stageCanvas'),
        multiplier: document.getElementById('hudMultiplier'),
        status: document.getElementById('hudStatus'),
        inputBet: document.getElementById('inputBet'),
        inputAutoCash: document.getElementById('inputAutoCash'),
        chips: document.querySelectorAll('.chip-btn'),
        btnAction: document.getElementById('btnAction')
      };

      const ctx = dom.canvas.getContext('2d');

      function syncBalanceUI() {
        dom.balance.innerText = `${userBalance.toLocaleString('en-US')} ED`;
      }

      const FSM = {
        BETTING: 'BETTING',
        FLYING: 'FLYING',
        CRASHED: 'CRASHED',
        COOLDOWN: 'COOLDOWN'
      };

      let state = FSM.BETTING;
      let roundId = null;
      let crashTarget = 1.00;
      let currentMultiplier = 1.00;

      let playerHasBet = false;
      let playerBetAmount = 0;
      let playerHasCashedOut = false;

      let timerId = null;
      let rafId = null;
      let flightStartTime = 0;

      const pathHistory = [];

      function clearTimersAndLoops() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        if (timerId) {
          clearInterval(timerId);
          clearTimeout(timerId);
          timerId = null;
        }
      }

      function enterBetting() {
        clearTimersAndLoops();
        state = FSM.BETTING;
        roundId = 'RND-' + Math.floor(100000 + Math.random() * 900000);
        currentMultiplier = 1.00;

        playerHasBet = false;
        playerBetAmount = 0;
        playerHasCashedOut = false;

        pathHistory.length = 0;
        pathHistory.push({ x: 30, y: dom.canvas.height - 30 });

        dom.roundId.innerText = `ROUND: #${roundId}`;
        dom.statePill.innerText = 'STATUS: BETTING';
        dom.statePill.style.color = 'var(--neon-green)';

        dom.multiplier.innerText = '1.00x';
        dom.multiplier.className = 'hud-multiplier';

        dom.inputBet.disabled = false;
        dom.inputAutoCash.disabled = false;
        dom.chips.forEach(c => c.disabled = false);

        dom.btnAction.disabled = false;
        dom.btnAction.className = 'action-button btn-state-bet';
        dom.btnAction.innerText = 'СТАВКА';

        renderCanvasFrame(0, 1.00, false);

        let countdownSec = 5.0;
        dom.status.innerText = `СТАРТ ЧЕРЕЗ 5.0с`;

        timerId = setInterval(() => {
          countdownSec -= 0.1;
          if (countdownSec <= 0.05) {
            clearInterval(timerId);
            timerId = null;
            enterFlying();
          } else {
            dom.status.innerText = `СТАРТ ЧЕРЕЗ ${countdownSec.toFixed(1)}с`;
          }
        }, 100);
      }

      function enterFlying() {
        clearTimersAndLoops();
        state = FSM.FLYING;

        dom.statePill.innerText = 'STATUS: FLYING';
        dom.statePill.style.color = 'var(--neon-cyan)';
        dom.status.innerText = 'РАКЕТА ЛЕТИТ...';

        dom.inputBet.disabled = true;
        dom.inputAutoCash.disabled = true;
        dom.chips.forEach(c => c.disabled = true);

        const rand = Math.random();
        if (rand < 0.06) {
          crashTarget = 1.00;
        } else {
          crashTarget = parseFloat((0.94 / (1 - rand)).toFixed(2));
        }

        if (playerHasBet) {
          dom.btnAction.disabled = false;
          dom.btnAction.className = 'action-button btn-state-cashout';
          dom.btnAction.innerText = `ЗАБРАТЬ ${(playerBetAmount * 1.00).toFixed(0)} ED`;
        } else {
          dom.btnAction.disabled = true;
          dom.btnAction.className = 'action-button btn-state-disabled';
          dom.btnAction.innerText = 'РАУНД ИДЁТ...';
        }

        flightStartTime = performance.now();

        function frame(now) {
          if (state !== FSM.FLYING) return;

          try {
            const elapsed = Math.max(0, (now - flightStartTime) / 1000);
            const nextMult = parseFloat(Math.pow(Math.E, 0.08 * elapsed).toFixed(2));

            if (!Number.isFinite(nextMult) || Number.isNaN(nextMult)) {
              enterCrashed(currentMultiplier);
              return;
            }

            currentMultiplier = nextMult;

            const autoCashLimit = parseFloat(dom.inputAutoCash.value);
            if (
              playerHasBet &&
              !playerHasCashedOut &&
              Number.isFinite(autoCashLimit) &&
              autoCashLimit >= 1.01 &&
              currentMultiplier >= autoCashLimit
            ) {
              cashout();
            }

            if (playerHasBet && !playerHasCashedOut) {
              const liveWin = Math.floor(playerBetAmount * currentMultiplier);
              dom.btnAction.innerText = `ЗАБРАТЬ ${liveWin} ED`;
            }

            if (currentMultiplier >= crashTarget) {
              currentMultiplier = crashTarget;
              enterCrashed(crashTarget);
              return;
            }

            dom.multiplier.innerText = `${currentMultiplier.toFixed(2)}x`;
            renderCanvasFrame(elapsed, currentMultiplier, true);

            rafId = requestAnimationFrame(frame);
          } catch (err) {
            enterCrashed(currentMultiplier);
          }
        }

        rafId = requestAnimationFrame(frame);
      }

      function enterCrashed(finalMult) {
        clearTimersAndLoops();
        state = FSM.CRASHED;

        const safeMult = (Number.isFinite(finalMult) && finalMult >= 1.00) ? finalMult : 1.00;

        dom.statePill.innerText = 'STATUS: CRASHED';
        dom.statePill.style.color = 'var(--neon-pink)';

        dom.multiplier.innerText = `КРАШ ${safeMult.toFixed(2)}x`;
        dom.multiplier.className = 'hud-multiplier crashed';

        dom.status.innerText = 'РАКЕТА ВЗОРВАЛАСЬ!';

        dom.btnAction.disabled = true;
        dom.btnAction.className = 'action-button btn-state-crashed';
        dom.btnAction.innerText = 'ВЗРЫВ!';

        haptic('crash');
        pushHistory(safeMult);

        enterCooldown();
      }

      function enterCooldown() {
        state = FSM.COOLDOWN;

        dom.statePill.innerText = 'STATUS: COOLDOWN';
        dom.statePill.style.color = 'var(--neon-yellow)';

        let cooldownSeconds = 5.0;
        dom.btnAction.innerText = `СЛЕД. РАУНД ЧЕРЕЗ 5.0с`;

        timerId = setInterval(() => {
          cooldownSeconds -= 0.1;
          if (cooldownSeconds <= 0.05) {
            clearInterval(timerId);
            timerId = null;
            enterBetting();
          } else {
            dom.btnAction.innerText = `СЛЕД. РАУНД ЧЕРЕЗ ${cooldownSeconds.toFixed(1)}с`;
          }
        }, 100);
      }

      function cashout() {
        if (playerHasCashedOut || !playerHasBet || state !== FSM.FLYING) return;

        playerHasCashedOut = true;
        const profit = Math.floor(playerBetAmount * currentMultiplier);

        userBalance += profit;
        syncBalanceUI();
        haptic('cashout');

        dom.btnAction.disabled = true;
        dom.btnAction.className = 'action-button btn-state-taken';
        dom.btnAction.innerText = `ВЫИГРЫШ ЗАБРАН (+${profit})`;
        dom.status.innerText = 'ОЖИДАНИЕ КОНЦА РАУНДА';
      }

      function handleActionClick() {
        if (state === FSM.BETTING) {
          if (playerHasBet) return;

          const rawBet = parseFloat(dom.inputBet.value);
          if (!Number.isFinite(rawBet) || rawBet <= 0) return;

          const finalBet = Math.floor(rawBet);
          if (userBalance < finalBet) {
            alert('Недостаточно средств!');
            return;
          }

          userBalance -= finalBet;
          syncBalanceUI();

          playerHasBet = true;
          playerBetAmount = finalBet;
          playerHasCashedOut = false;

          haptic('click');

          dom.inputBet.disabled = true;
          dom.chips.forEach(c => c.disabled = true);

          dom.btnAction.disabled = true;
          dom.btnAction.className = 'action-button btn-state-disabled';
          dom.btnAction.innerText = 'СТАВКА ПРИНЯТА';
        } else if (state === FSM.FLYING) {
          if (playerHasBet && !playerHasCashedOut) {
            cashout();
          }
        }
      }

      dom.btnAction.addEventListener('click', handleActionClick);

      dom.chips.forEach(chip => {
        chip.addEventListener('click', () => {
          if (state !== FSM.BETTING || playerHasBet) return;
          const val = chip.getAttribute('data-val');
          dom.inputBet.value = val;
          haptic('click');
        });
      });

      function pushHistory(mult) {
        const item = document.createElement('span');
        let colorClass = 'low';
        if (mult >= 2.0) colorClass = 'high';
        else if (mult >= 1.5) colorClass = 'mid';

        item.className = `history-item ${colorClass}`;
        item.innerText = `${mult.toFixed(2)}x`;

        dom.history.insertBefore(item, dom.history.firstChild);
        if (dom.history.children.length > 8) {
          dom.history.removeChild(dom.history.lastChild);
        }
      }

      function renderCanvasFrame(elapsedSec, mult, isFlying) {
        const w = dom.canvas.width;
        const h = dom.canvas.height;

        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < w; x += 36) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
        for (let y = 0; y < h; y += 36) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(30, h - 30);
        ctx.lineTo(w - 10, h - 30);
        ctx.moveTo(30, h - 30);
        ctx.lineTo(30, 10);
        ctx.stroke();

        const safeMult = (Number.isFinite(mult) && mult >= 1.00) ? mult : 1.00;
        const progress = Math.min((safeMult - 1.00) / 3.00, 1.00);

        const curX = 30 + progress * (w - 70);
        const curY = (h - 30) - Math.pow(progress, 1.35) * (h - 60);

        if (Number.isFinite(curX) && Number.isFinite(curY)) {
          pathHistory.push({ x: curX, y: curY });
          if (pathHistory.length > 60) pathHistory.shift();
        }

        if (pathHistory.length > 1) {
          ctx.strokeStyle = '#00f0ff';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(pathHistory[0].x, pathHistory[0].y);
          for (let i = 1; i < pathHistory.length; i++) {
            ctx.lineTo(pathHistory[i].x, pathHistory[i].y);
          }
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        drawRocketSprite(curX, curY, isFlying);
      }

      function drawRocketSprite(x, y, withFire) {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-Math.PI / 4.2);

        ctx.fillStyle = '#fcee0a';
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.lineTo(7, 9);
        ctx.lineTo(-7, 9);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ff003c';
        ctx.beginPath();
        ctx.moveTo(-5, 5);
        ctx.lineTo(-10, 10);
        ctx.lineTo(-4, 9);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(5, 5);
        ctx.lineTo(10, 10);
        ctx.lineTo(4, 9);
        ctx.closePath();
        ctx.fill();

        if (withFire) {
          ctx.fillStyle = '#05ffa1';
          ctx.beginPath();
          ctx.moveTo(-3, 9);
          ctx.lineTo(3, 9);
          ctx.lineTo(0, 9 + Math.random() * 12);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      window.addEventListener('beforeunload', clearTimersAndLoops);

      syncBalanceUI();
      enterBetting();
    })();
  </script>
</body>
